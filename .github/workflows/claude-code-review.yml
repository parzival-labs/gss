# Claude reviews every non-draft pull request from a branch in this repo.
# Findings arrive as inline comments. The review never approves or blocks
# the PR; a human still decides whether to merge.
#
# Auth: set the CLAUDE_CODE_OAUTH_TOKEN repository secret (generate with
# `claude setup-token`). To use a Claude Console API key instead, replace the
# claude_code_oauth_token line with:
#   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    # Secrets are withheld from fork PRs on public repos, so review only
    # same-repo branches. Drafts are skipped by the review skill itself.
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: "/code-review:code-review --comment ${{ github.repository }}/pull/${{ github.event.pull_request.number }}"
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
